services:
  - type: web
    name: tarot-web
    runtime: node
    plan: free
    buildCommand: echo "No build required"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_KEY
        sync: false
